version: '3.8'

services:

  db:
    image: postgres:15
    container_name: postgres_db
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: django_app
    command: gunicorn cicddjango.wsgi:application --bind 0.0.0:8000 --workers 3
    volumes:
      - static_volume:/app/staticfiles      
    ports:
      - "8000:8000"
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
      image: nginx:alpine
      container_name: nginx_proxy
      ports:
        - "80:80"
      volumes:
        - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      depends_on:
        web:
          condition: service_started

volumes:
  postgres_data:
  static_volume: